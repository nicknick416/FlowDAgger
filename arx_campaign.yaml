# 不要把旧 campaign 的 episode / ACTIVE 拷进新目录。

# --- 路径与身份 ---
campaign_id: arx_connect_elevator_pins_0901_base_retrain_v6
runs_root: /home/ubuntu/yzy/flowdagger_runs
# 可选。不填则使用 {runs_root}/{campaign_id}
